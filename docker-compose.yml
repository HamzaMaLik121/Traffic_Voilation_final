# ═════════════════════════════════════════════════════════════════════
#  Traffic Violation Detection System — Docker Compose (3-service)
# ═════════════════════════════════════════════════════════════════════
#
#  ┌────────────────────────────────────────────────────────────────────────────────┐
#  │                              NETWORK ARCHITECTURE                              │
#  │                                                                                │
#  │   ┌──────────────┐    shared volume     ┌──────────────┐    shared volume     │
#  │   │   WORKER     │  ──────────────────►  │     API      │  ──────────────────► │
#  │   │  port: none  │      db_data          │   port:5000  │    evidence_data     │
#  │   │  (internal)  │                      │  (internal)  │                       │
#  │   │              │                      │      │       │                      │
#  │   │  YOLOv8 +    │    ┌──────────────┐   │  host port   │                      │
#  │   │  EasyOCR     │    │  SHARED DB   │   │  5001:5000  │                      │
#  │   │  process     │    │  (SQLite)    │   │      │       │                      │
#  │   │  video loop  │    └──────────────┘   │  REST API   │                      │
#  │   └──────────────┘                      └──────┬───────┘                      │
#  │                                                │                               │
#  │                                          HTTP /api/*                           │
#  │                                                │                               │
#  │                                         ┌──────────────┐                      │
#  │                                         │  DASHBOARD   │                      │
#  │                                         │   port:8501  │  host port 8502      │
#  │                                         │  (internal)  │ ─────────────────►   │
#  │                                         │              │  Browser access      │
#  │                                         │  Streamlit   │                      │
#  │                                         │  Web UI      │                      │
#  │                                         └──────────────┘                      │
#  └────────────────────────────────────────────────────────────────────────────────┘
#
#  Data flow:
#    1. Worker reads video files from mounted ./data/ folder
#    2. Worker runs YOLOv8 detection + EasyOCR on each frame
#    3. Worker writes violations to shared SQLite database (db_data volume)
#    4. Worker saves evidence JPGs + latest_frame.jpg to shared outputs (evidence_data volume)
#    5. API reads from the shared DB and outputs volume, exposes REST endpoints
#    6. Dashboard fetches violation data from API via HTTP and displays evidence images
#
#  Service dependency chain:
#    worker ──(writes to)──► db_data ◄──(reads from)── api ◄──(HTTP calls)── dashboard
#    worker ──(writes to)──► evidence_data ◄──(reads from)── dashboard (evidence images)
#    worker ──(writes to)──► evidence_data ◄──(reads from)── api (MJPEG live feed)
#
#  STARTUP ORDERING (fully automated):
#    1. worker starts, pulls models + videos from S3, starts the app
#    2. worker becomes HEALTHY only when models are on disk AND the
#       shared DB exists (see worker/healthcheck.sh)
#    3. api starts only after worker is healthy (depends_on below)
#    4. dashboard starts only after api (and worker) are healthy
#    → Nothing starts before the model data has been pulled from S3.
#
#  Networking:
#    • All 3 services are on the default Docker Compose network (bridge)
#    • Services resolve each other by container_name: traffic-worker, traffic-api, traffic-dashboard
#    • Only api (port 5000 mapped to 5001) and dashboard (port 8501 mapped to 8502) are
#      exposed to the host — worker is internal-only
#    • The dashboard calls the API at http://api:5000 (Docker DNS resolution)
#    • The browser accesses the dashboard at http://localhost:8502
# ═════════════════════════════════════════════════════════════════════

services:

  # ── Worker: Video Detection Pipeline ───────────────────────────────
  worker:
    image: traffic-worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    pull_policy: build
    container_name: traffic-worker
    restart: on-failure

    volumes:
      # Shared volumes with api and dashboard
      - db_data:/app/database
      - evidence_data:/app/outputs

      # Models + videos are pulled from S3 on first boot and persisted
      # here so restarts don't re-download ~350MB (entrypoint verifies).
      - model_data:/app/models
      - video_data:/app/data/videos

      # Lane configuration (read-only; also baked into the image)
      - ./worker/config/lane_config.json:/app/config/lane_config.json:ro

      # Persist EasyOCR model cache across restarts (avoids re-download)
      - easyocr_cache:/root/.EasyOCR

      # LOCAL ONLY — AWS credentials so entrypoint.sh can pull models +
      # videos from S3 on startup. Models (ml/) and data/ are no longer
      # stored locally — they live in S3 (see MODEL_BUCKET below).
      # On EKS/Kubernetes replace this mount with an IAM role (IRSA).
      - ${HOME}/.aws:/root/.aws:ro

    environment:
      - PYTHONUNBUFFERED=1
      - LOOP_VIDEO=1
      - HEADLESS=1
      - MODEL_DIR=/app/models
      # S3 bucket containing models/ and data/ — entrypoint.sh syncs
      # them into /app/models and /app/data/videos on container start.
      - MODEL_BUCKET=traffic-violation-project-data-models
      - AWS_DEFAULT_REGION=us-east-1
      # Fail fast: never fall back to instance-metadata lookups inside the
      # container. With the ~/.aws mount this is unused anyway, but if the
      # mount is missing the aws-cli errors immediately instead of hanging
      # on an IMDS timeout, making the failure obvious in the logs.
    healthcheck:
      # Healthy only when models are on disk AND the shared DB exists.
      # start_period 90s: worker init (S3 sync + model load) completes in
      # seconds per prod logs; 90s is generous headroom, not a real 30min wait.
      # Invoked by path (not "sh" prefix) so the script's own #!/bin/bash
      # shebang is honored — the +x bit is baked in at build time via
      # `RUN chmod +x` in the Dockerfile, so this is safe as long as the
      # script is never bind-mounted over the image copy at runtime.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 1800s

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'

    # No port mapping — worker is internal only


  # ── API: Flask REST API ────────────────────────────────────────────
  api:
    image: traffic-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    pull_policy: build
    container_name: traffic-api
    restart: unless-stopped

    # API waits for the worker to be fully ready (models pulled from S3
    # + shared DB created) before it starts serving.
    depends_on:
      worker:
        condition: service_healthy

    volumes:
      # Read the same database the worker writes
      - db_data:/app/database
      # Read latest annotated frame for live feed
      - evidence_data:/app/outputs

    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - DATABASE_DIR=/app/database
      - OUTPUT_DIR=/app/outputs

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    ports:
      - "5001:5000"

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m
          cpus: '0.1'


  # ── Dashboard: Streamlit Web UI ────────────────────────────────────
  dashboard:
    image: traffic-dashboard:latest
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    pull_policy: build
    container_name: traffic-dashboard
    restart: unless-stopped

    depends_on:
      worker:
        condition: service_healthy
      api:
        condition: service_healthy

    ports:
      - "8502:8501"

    volumes:
      # Read evidence images from shared volume
      - evidence_data:/app/outputs

    environment:
      - API_URL=http://api:5000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'


# ── Named volumes (persist across container restarts) ─────────────────
volumes:
  db_data:
    driver: local
  evidence_data:
    driver: local
  easyocr_cache:
    driver: local
  # Models are downloaded from S3 on first boot and persist here, so
  # subsequent restarts skip the download (entrypoint verifies files).
  model_data:
    driver: local
  video_data:
    driver: local
