# ═════════════════════════════════════════════════════════════════════════════
#  SonarCloud analysis configuration — Traffic Violation Detection System
#
#  Used by the SonarCloud SAST job in .github/workflows/ci-cd-pipeline.yml.
#  The GitHub organization is passed to the action via the SONAR_ORGANIZATION
#  secret — no org value is hardcoded here.
# ═════════════════════════════════════════════════════════════════════════════
sonar.projectKey=HamzaMaLik121_Traffic_Voilation_final
sonar.organization=hamzamalik121
sonar.projectName=Traffic Violation Detection System
sonar.projectVersion=1.0

# Python code lives in the 3 services plus the training pipeline
sonar.sources=api,worker,dashboard,src
sonar.python.version=3.12

# Don't analyze test/support code and generated artifacts
sonar.exclusions=**/tests/**,**/*_test.py,worker/config/**
sonar.test.exclusions=**/tests/**,**/*_test.py
