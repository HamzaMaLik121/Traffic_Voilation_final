apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvs-worker
  namespace: traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tvs-worker
  template:
    metadata:
      labels:
        app: tvs-worker
    spec:
      containers:
      - name: worker
        image: hamzamalik1/traffic-worker:latest
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HEADLESS
          value: "1"
        - name: LOOP_VIDEO
          value: "1"
        - name: MODEL_DIR
          value: "/app/models"
        # Models + videos are pulled automatically from S3 by entrypoint.sh
        # on first boot (no manual steps). Use an IAM role / IRSA instead
        # of static credentials on EKS.
        - name: MODEL_BUCKET
          value: "traffic-violation-project-data-models"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        readinessProbe:
          # Healthy only once models are on disk AND the shared DB exists
          # (entrypoint.sh pulls from S3 first). api/dashboard deployments
          # only route traffic after this passes.
          exec:
            command: ["/app/healthcheck.sh"]
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20
        resources:
          limits:
            memory: "3Gi"
            cpu: "3"
          requests:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: db-data
          mountPath: /app/database
        - name: evidence-data
          mountPath: /app/outputs
        - name: models
          mountPath: /app/models
        - name: lane-config
          mountPath: /app/config/lane_config.json
          subPath: lane_config.json
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-pvc
      - name: evidence-data
        persistentVolumeClaim:
          claimName: evidence-pvc
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
      - name: lane-config
        configMap:
          name: lane-config
