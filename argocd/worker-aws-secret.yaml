# ═════════════════════════════════════════════════════════════════════
#  Worker AWS Credentials Secret
#
#  This has NOTHING to do with ArgoCD.
#
#  ArgoCD only needs GitHub access (no AWS).
#  ArgoCD's job is: read GitHub → apply Helm chart to cluster. Done.
#
#  This Secret is used by the WORKER CONTAINER inside the pod.
#  On startup, the worker runs entrypoint.sh which calls:
#    aws s3 sync s3://traffic-violation-project-data-models/models/ /app/models/
#    aws s3 sync s3://traffic-violation-project-data-models/data/   /app/data/videos/
#  Those aws CLI calls need AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#  injected as env vars — that's what this Secret provides.
#
#  Flow:
#    ArgoCD → deploys Pod → worker container starts → pulls models from S3
#       ↑                                                       ↑
#    no AWS here                               needs THIS Secret
#
#  ── How to create this Secret (run ONCE on EC2 before deploying) ──
#
#  Recommended — create directly from plaintext (nothing stored in a file):
#
#    kubectl create namespace traffic-violation --dry-run=client -o yaml | kubectl apply -f -
#
#    kubectl create secret generic traffic-violation-aws-credentials \
#      --namespace traffic-violation \
#      --from-literal=AWS_ACCESS_KEY_ID=YOUR_REAL_KEY \
#      --from-literal=AWS_SECRET_ACCESS_KEY=YOUR_REAL_SECRET
#
#  Alternatively — fill in base64 values below and apply this file:
#    echo -n "YOUR_ACCESS_KEY_ID"     | base64
#    echo -n "YOUR_SECRET_ACCESS_KEY" | base64
#    kubectl apply -f argocd/worker-aws-secret.yaml
#
#  ⚠  NEVER commit real credentials into this file or any file in Git.
# ═════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: traffic-violation-aws-credentials
  namespace: traffic-violation
  annotations:
    # Tells ArgoCD: "I manage this Secret manually, don't touch it."
    # Without this annotation ArgoCD's prune=true would delete it on sync.
    argocd.argoproj.io/managed: "false"
type: Opaque
data:
  # HOW TO FILL IN:
  #   On your Mac/EC2 terminal run:
  #     echo -n "YOUR_ACCESS_KEY_ID"     | base64
  #     echo -n "YOUR_SECRET_ACCESS_KEY" | base64
  #   Paste the outputs below, then:
  #     kubectl apply -f argocd/worker-aws-secret.yaml
  #
  #   After the project demo — blank these out, commit, push:
  #     AWS_ACCESS_KEY_ID: ""
  #     AWS_SECRET_ACCESS_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
