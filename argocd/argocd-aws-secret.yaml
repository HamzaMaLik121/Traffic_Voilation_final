# ═════════════════════════════════════════════════════════════════════
#  AWS Credentials Secret — Traffic Violation Detection System
#
#  This Secret is referenced by argocd-app.yaml via:
#    aws.existingSecret: "traffic-violation-aws-credentials"
#
#  ⚠  DO NOT commit real credentials here.
#     This file is a TEMPLATE — fill in base64-encoded values below,
#     or use the one-liner at the bottom of this comment to create
#     the secret directly without touching this file.
#
#  Option A — Apply this file after filling in the values:
#    1. Base64-encode your keys (NO trailing newline):
#         echo -n "AKIAIOSFODNN7EXAMPLE"  | base64
#         echo -n "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" | base64
#    2. Paste the outputs into AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY below.
#    3. kubectl apply -f argocd/argocd-aws-secret.yaml
#
#  Option B — Create the secret directly from plaintext (recommended,
#             keeps real values out of any file):
#    kubectl create secret generic traffic-violation-aws-credentials \
#      --namespace traffic-violation \
#      --from-literal=AWS_ACCESS_KEY_ID=YOUR_KEY_HERE \
#      --from-literal=AWS_SECRET_ACCESS_KEY=YOUR_SECRET_HERE
#
#  Either way, run this ONCE before applying argocd-app.yaml.
# ═════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: traffic-violation-aws-credentials
  namespace: traffic-violation
  annotations:
    # Prevent ArgoCD from pruning this secret (it is managed outside
    # the Helm chart so ArgoCD would otherwise delete it on sync).
    argocd.argoproj.io/managed: "false"
type: Opaque
data:
  # Replace with your own base64-encoded values.
  # echo -n "YOUR_ACCESS_KEY_ID"     | base64
  AWS_ACCESS_KEY_ID: WUVSX0FDQ0VTU19LRVlfSEVSRQ==
  # echo -n "YOUR_SECRET_ACCESS_KEY" | base64
  AWS_SECRET_ACCESS_KEY: WUVSX1NFQ1JFVF9BQ0NFU1NfS0VZX0hFUkU=
